# Sitio de nginx para la demo (SCRUM-166). Todo entra por aquí y va a la tienda (Next, :3001),
# cuyo proxy /api/[...ruta] llama a la API por la red interna de Docker.
#
#   sudo cp cabello-perfecto.conf /etc/nginx/sites-available/
#   sudo sed -i 's/demo.ejemplo.cl/TU_SUBDOMINIO/' /etc/nginx/sites-available/cabello-perfecto.conf
#   sudo ln -s /etc/nginx/sites-available/cabello-perfecto.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU_SUBDOMINIO      # agrega HTTPS y la redirección desde HTTP

server {
    listen 80;
    listen [::]:80;
    server_name demo.ejemplo.cl;

    # Fotos del catálogo y documentos de verificación: hasta 4 MB por archivo
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Se REEMPLAZA (no se agrega): así nadie puede inventar su IP y saltarse los límites
        # por IP (RNF-09). Va con PROXIES_CONFIABLES=1 en el .env.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Crear la OT de Chilexpress puede tardar hasta 30 s (SCRUM-153)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
